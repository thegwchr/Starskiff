name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.1.0
        required: true
        type: string
      title:
        description: Release title
        required: false
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: false
        type: boolean
      changelog:
        description: Change log; use \n for line breaks
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout Starskiff
        uses: actions/checkout@v4

      - name: Manage Version
        run: |
          git fetch --prune --unshallow --tags
          GIT_SHA="$(git rev-parse --short HEAD)"
          eval $(grep -m 1 "MARKETING_VERSION =" Starskiff.xcodeproj/project.pbxproj | tr -d ';' | tr -d '\t' | tr -d " ")
          echo "VER=$MARKETING_VERSION" >> $GITHUB_ENV
          echo "SHORT_SHA=$GIT_SHA" >> $GITHUB_ENV

      - name: Release Build
        run: |
          xcodebuild ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            -scheme Starskiff -configuration Release -derivedDataPath build \
            -disableAutomaticPackageResolution \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Create Disk Image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          chmod +x scripts/build-dmg.sh
          DMG_NAME="Starskiff-${TAG}.dmg" scripts/build-dmg.sh

      - name: Prepare release notes
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          python3 << 'EOF'
          import os
          from pathlib import Path

          changelog = os.environ["CHANGELOG"].replace("\\n", "\n")
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(changelog + "\n")
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title || inputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ inputs.prerelease }}
          files: Artifacts/*.dmg
