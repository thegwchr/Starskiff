name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.1.0
        required: true
        type: string
      title:
        description: Release title
        required: false
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout Starskiff
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install create-dmg
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Manage Version
        run: |
          git fetch --prune --unshallow --tags
          GIT_SHA="$(git rev-parse --short HEAD)"
          eval $(grep -m 1 "MARKETING_VERSION =" Starskiff.xcodeproj/project.pbxproj | tr -d ';' | tr -d '\t' | tr -d " ")
          echo "VER=$MARKETING_VERSION" >> $GITHUB_ENV
          echo "SHORT_SHA=$GIT_SHA" >> $GITHUB_ENV

      - name: Release Build
        run: |
          set -o pipefail && xcodebuild ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO \
            -scheme Starskiff -configuration Release -derivedDataPath build \
            -disableAutomaticPackageResolution \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO | xcbeautify

      - name: Create Disk Image
        run: |
          XCBUILD_PATH="build/Build/Products/Release"
          cp LICENSE $XCBUILD_PATH
          cd $XCBUILD_PATH
          curl -sLO https://openintelwireless.github.io/HeliPort/dmg/VolumeIcon.icns
          curl -sLO https://openintelwireless.github.io/HeliPort/dmg/dmg-background.tiff
          create-dmg \
            --volname "Starskiff" \
            --volicon "VolumeIcon.icns" \
            --background "dmg-background.tiff" \
            --window-pos 200 120 \
            --window-size 660 420 \
            --text-size 12 \
            --eula "LICENSE" \
            --icon-size 160 \
            --icon "Starskiff.app" 180 170 \
            --hide-extension "Starskiff.app" \
            --app-drop-link 480 170 \
            "Starskiff.dmg" \
            "./Starskiff.app"
          cd -
          mkdir -p Artifacts
          cp -R ${XCBUILD_PATH}/*.dmg Artifacts

      - name: Publish GitHub Release
        env:
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          RELEASE_TITLE="${TITLE:-$TAG}"
          NOTES="Starskiff release for ${TAG}."
          PRE_FLAG=""
          if [[ "$PRERELEASE" == "true" ]]; then
            PRE_FLAG="--prerelease"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Artifacts/* --clobber
          else
            gh release create "$TAG" Artifacts/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$NOTES" \
              $PRE_FLAG
          fi
